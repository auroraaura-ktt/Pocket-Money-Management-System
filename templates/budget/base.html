<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pocket Money Management System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        success: '#16a34a',
                        danger: '#dc2626',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 px-4 md:px-8 h-16 flex items-center sticky top-0 z-50 shadow-sm">
        <a href="{% url 'budget:home' %}" class="text-xl font-bold text-blue-600 mr-8">💰 Pocket Money</a>
        <a href="{% url 'budget:home' %}" class="{% if request.resolver_match.url_name == 'home' %}text-blue-600 bg-blue-50{% else %}text-gray-500 hover:text-blue-600{% endif %} px-4 py-2 rounded-lg font-medium transition">Home</a>
        <a href="{% url 'budget:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}text-blue-600 bg-blue-50{% else %}text-gray-500 hover:text-blue-600{% endif %} px-4 py-2 rounded-lg font-medium transition">Dashboard</a>
        <a href="{% url 'budget:reports' %}" class="{% if request.resolver_match.url_name == 'reports' %}text-blue-600 bg-blue-50{% else %}text-gray-500 hover:text-blue-600{% endif %} px-4 py-2 rounded-lg font-medium transition">Reports</a>
    </nav>

    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 md:px-8 pt-4">
        {% for message in messages %}
        <div class="mb-3 px-4 py-3 rounded-lg text-sm font-medium
            {% if message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200
            {% elif message.tags == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
            {% elif message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200
            {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
